name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 本番の Azure Functions は Node 20 で動く。CI は STORE=sqlite（node:sqlite、Node 22.5+）の
          # テストも実行したいので、テスト専用にこちらは新しいバージョンを使う
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
