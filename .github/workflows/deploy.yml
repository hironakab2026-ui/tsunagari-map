name: Deploy

# main への push で app（Azure Static Web Apps）と api（Azure Functions）を自動デプロイする。
# 「随時編集・訂正・公開」を実現するための CI/CD。
#
# 事前に GitHub の Settings > Secrets and variables > Actions で以下を設定してください（infra/main.bicep でリソース作成後）:
#   AZURE_STATIC_WEB_APPS_API_TOKEN … Static Web Apps のデプロイトークン（Azure Portal の「管理用トークン」）
#   AZURE_FUNCTIONAPP_PUBLISH_PROFILE … Function App の発行プロファイル（Azure Portal からダウンロード）
#   AZURE_FUNCTIONAPP_NAME … infra/main.bicep の出力 functionAppName の値
#   VITE_API_BASE … 例: https://<functionAppName>.azurewebsites.net/api
#
# Secrets が未設定のうちは、該当ジョブは自動的にスキップされます（CI が失敗し続けることはありません）。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    if: ${{ vars.AZURE_STATIC_WEB_APPS_API_TOKEN != '' || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: app
          output_location: dist
        env:
          VITE_USE_MOCK: "false"
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}

  deploy-api:
    runs-on: ubuntu-latest
    if: ${{ vars.AZURE_FUNCTIONAPP_NAME != '' || secrets.AZURE_FUNCTIONAPP_NAME != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run build -w api
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          package: api
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
